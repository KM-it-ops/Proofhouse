<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Proofhouse app demo</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0a0f0c; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0f0c;
        background-image:
          linear-gradient(rgba(61, 220, 132, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(61, 220, 132, 0.07) 1px, transparent 1px);
        background-size: 72px 72px;
      }
      .dot {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #3ddc84;
        opacity: 0.45;
      }
      #glow {
        position: absolute;
        width: 820px;
        height: 820px;
        border-radius: 50%;
        left: 180px;
        top: -80px;
        background: radial-gradient(circle, rgba(61, 220, 132, 0.22), transparent 68%);
      }
      .clip { position: absolute; inset: 0; }
      .ripple {
        position: absolute;
        left: 850px;
        top: 650px;
        width: 220px;
        height: 220px;
        margin: -110px 0 0 -110px;
        border: 2px solid #3ddc84;
        border-radius: 50%;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hype" data-width="1920" data-height="1080" data-duration="42">
      <div id="glow"></div>
      <div id="dots"></div>
      <div
        id="screen-input"
        class="clip"
        data-composition-id="screen-input"
        data-composition-src="compositions/input.html"
        data-start="0"
        data-duration="14"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="screen-clarify"
        class="clip"
        data-composition-id="screen-clarify"
        data-composition-src="compositions/clarify.html"
        data-start="14"
        data-duration="14"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="screen-output"
        class="clip"
        data-composition-id="screen-output"
        data-composition-src="compositions/output.html"
        data-start="28"
        data-duration="14"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div id="ripple-a" class="ripple"></div>
      <div id="ripple-b" class="ripple"></div>
      <audio id="bed" src="bed.wav" data-start="0" data-duration="42" data-track-index="3" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const host = document.getElementById("dots");
      for (let i = 0; i < 28; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.id = "dot-" + i;
        dot.style.left = (i * 67) % 1880 + "px";
        dot.style.top = (i * 113) % 1040 + "px";
        host.appendChild(dot);
        const dx = Math.sin(i) * 70;
        const dy = Math.cos(i * 0.7) * 50;
        tl.fromTo("#dot-" + i, { x: 0, y: 0 }, { x: dx, y: dy, duration: 21, ease: "sine.inOut" }, 0);
        tl.to("#dot-" + i, { x: -dx, y: -dy, duration: 21, ease: "sine.inOut" }, 21);
      }
      tl.fromTo("#glow", { x: 0, y: 0 }, { x: 220, y: 80, duration: 42, ease: "sine.inOut" }, 0);
      tl.fromTo("#root", { backgroundPosition: "0px 0px" }, { backgroundPosition: "80px 50px", duration: 42, ease: "none" }, 0);
      tl.fromTo("#ripple-a", { scale: 0.2, opacity: 0.8 }, { scale: 2.6, opacity: 0, duration: 0.9, ease: "power2.out" }, 11.3);
      tl.fromTo("#ripple-b", { scale: 0.2, opacity: 0.8 }, { scale: 2.6, opacity: 0, duration: 0.9, ease: "power2.out" }, 25.3);
      window.__timelines["hype"] = tl;
    </script>
  </body>
</html>
