<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Cascadia Mono"; src: local("Cascadia Mono"); }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
          color: #c8f5d8;
        }
        .app {
          width: 1080px;
          margin: 48px auto 0;
          background: #0a0f0c;
          border: 1px solid #1e3a2a;
          border-radius: 12px;
          padding: 18px 22px;
        }
        .brand { color: #3ddc84; font-weight: 800; letter-spacing: 6px; font-size: 22px; }
        .meta { display: flex; justify-content: space-between; color: #5a8a6a; font-size: 13px; margin: 10px 0; }
        .row {
          border: 1px solid #1e3a2a;
          background: #0d1410;
          border-radius: 8px;
          padding: 8px 12px;
          margin-bottom: 7px;
        }
        .q { font-size: 14px; }
        .a { color: #3ddc84; font-size: 15px; font-weight: 700; margin-top: 2px; }
      </style>
      <div id="root" data-composition-id="screen-clarify" data-width="1920" data-height="1080">
        <div class="app">
          <div class="brand">PROOFHOUSE</div>
          <div class="meta"><span>← back</span><span>7/7 answered</span></div>
          <div class="row" id="row-0">
            <div class="q">What should this prompt produce?</div>
            <div class="a">A full goal with nonidempotent loops and instructions for production of a fully working Facebook clone.</div>
          </div>
          <div class="row" id="row-1">
            <div class="q">Which pieces should it include?</div>
            <div class="a">Let Grok decide.</div>
          </div>
          <div class="row" id="row-2">
            <div class="q">Who is it for?</div>
            <div class="a">Social media users.</div>
          </div>
          <div class="row" id="row-3">
            <div class="q">Phone, web, or both?</div>
            <div class="a">Both.</div>
          </div>
          <div class="row" id="row-4">
            <div class="q">What must it avoid?</div>
            <div class="a">Trademarked or registered copyrights and names.</div>
          </div>
          <div class="row" id="row-5">
            <div class="q">Who chooses the stack?</div>
            <div class="a">The agent chooses the stack.</div>
          </div>
          <div class="row" id="row-6">
            <div class="q">Do people sign in?</div>
            <div class="a">People sign in.</div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        for (let i = 0; i < 7; i++) {
          tl.fromTo("#row-" + i, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.2 + i * 0.28);
        }
        window.__timelines["screen-clarify"] = tl;
      </script>
    </template>
  </body>
</html>
