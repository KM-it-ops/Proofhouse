name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest reproducible input and command.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PromptRig version, OS, Python version, and relevant provider adapter.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, secrets, and private data.
          required: true
