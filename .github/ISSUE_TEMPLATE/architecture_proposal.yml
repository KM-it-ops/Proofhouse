name: Architecture proposal
description: Propose a contract or architectural change
title: "[Architecture]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Identify the affected contract, invariant, or accepted decision.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision
      description: Include compatibility, migration, and validation consequences.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link tests, review findings, benchmarks, or specifications.
    validations:
      required: true
