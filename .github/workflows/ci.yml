name: CI

# Push CI is main-only so feature/docs/fix branch pushes do not burn
# Actions minutes. Exercise the matrix via a pull_request into main,
# or via workflow_dispatch.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Validate datasets (legacy PromptOps CLI)
        run: |
          python -m proofhouse.cli validate --dataset evals/datasets/prompt_audit_cases.jsonl
          python -m proofhouse.cli validate --dataset evals/datasets/meta_prompting_cases.jsonl
          python -m proofhouse.cli validate --dataset evals/datasets/agentic_mode_cases.jsonl
          python -m proofhouse.cli validate --dataset evals/datasets/adversarial_cases.jsonl

      - name: Compiler Core smoke test -- installed script
        run: |
          proofhouse-compiler doctor --json
          proofhouse-compiler adapters --json

      - name: Compiler Core smoke test -- python -m invocation
        run: |
          python -m proofhouse.compiler.cli_compiler doctor --json
          python -m proofhouse.compiler.cli_compiler adapters --json

      - name: Compiler --help smoke
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: proofhouse-compiler --help

  typescript-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Regenerate TypeScript contracts and fail on drift
        run: |
          python scripts/generate_typescript_contracts.py
          git diff --exit-code -- src/proofhouse/compiler/typescript

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Isolated venv install
        run: |
          python -m venv /tmp/pr-wheel
          /tmp/pr-wheel/bin/pip install dist/*.whl

      - name: Doctor on installed wheel
        run: |
          /tmp/pr-wheel/bin/proofhouse-compiler doctor --json

      - name: Installed consumer smoke
        run: |
          /tmp/pr-wheel/bin/python tests/compiler/fixtures/external_consumer_closed_loop.py tests/compiler/fixtures/closed_loop_requirements_minimal.json

      - name: Reference workflow on the installed wheel
        env:
          PROOFHOUSE_HOME: /tmp/pr-wheel-home
        run: |
          /tmp/pr-wheel/bin/python scripts/reference_workflow.py --cli /tmp/pr-wheel/bin/proofhouse-compiler --quiet

      - name: Generated model surfaces and skill bundle are in sync
        run: |
          /tmp/pr-wheel/bin/python scripts/generate_model_surfaces.py --check
