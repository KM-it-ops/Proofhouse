name: CI

on:
  push:
    branches: ["main", "feature/**", "docs/**", "fix/**"]
  pull_request:
    branches: ["main", "feature/promptrig-framework"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest

      - name: Validate datasets (legacy PromptOps CLI)
        run: |
          python -m promptrig.cli validate --dataset evals/datasets/prompt_audit_cases.jsonl
          python -m promptrig.cli validate --dataset evals/datasets/meta_prompting_cases.jsonl
          python -m promptrig.cli validate --dataset evals/datasets/agentic_mode_cases.jsonl
          python -m promptrig.cli validate --dataset evals/datasets/adversarial_cases.jsonl

      - name: Compiler Core smoke test -- installed script
        run: |
          promptrig-compiler doctor --json
          promptrig-compiler adapters --json

      - name: Compiler Core smoke test -- python -m invocation
        run: |
          python -m promptrig.compiler.cli_compiler doctor --json
          python -m promptrig.compiler.cli_compiler adapters --json

  typescript-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Regenerate TypeScript contracts and fail on drift
        run: |
          python scripts/generate_typescript_contracts.py
          git diff --exit-code -- architecture/typescript

  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Isolated venv install
        run: |
          python -m venv /tmp/pr-wheel
          /tmp/pr-wheel/bin/pip install dist/*.whl

      - name: Doctor on installed wheel
        run: /tmp/pr-wheel/bin/promptrig-compiler doctor --json

      - name: Installed consumer smoke
        run: |
          /tmp/pr-wheel/bin/python tests/compiler/fixtures/external_consumer_closed_loop.py tests/compiler/fixtures/closed_loop_requirements_minimal.json
