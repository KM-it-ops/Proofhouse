name: CI Post-Merge Smoke

on:
  push:
    branches: ["feature/promptrig-framework"]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Smoke and integrity
        run: |
          python -m promptrig.compiler.cli_compiler doctor --json
          python -m promptrig.compiler.cli_compiler adapters --json
          python -m pytest -q \
            tests/compiler/test_contract_schema_drift.py \
            tests/requirements/test_requirements_contract.py
