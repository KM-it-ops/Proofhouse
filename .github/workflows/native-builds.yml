name: Native sample builds

on:
  workflow_dispatch:
  # A manual workflow can only be started once it is on main, so pushing this branch runs it too.
  push:
    branches: [ci/native-builds]

permissions:
  contents: read

jobs:
  sample:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: pwa, os: ubuntu-latest }
          - { platform: linux, os: ubuntu-latest }
          - { platform: android, os: ubuntu-latest }
          - { platform: macos, os: macos-latest }
          - { platform: ios, os: macos-latest }
          - { platform: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        if: matrix.platform != 'pwa'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - name: Install Android platform and tools
        if: matrix.platform == 'android'
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Install Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Set up Rust
        if: contains(fromJSON('["linux", "macos", "windows"]'), matrix.platform)
        run: rustup toolchain install stable --profile minimal
      - name: Check Xcode and CocoaPods
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: |
          xcode-select -p
          xcodebuild -version
          if [ '${{ matrix.platform }}' = ios ]; then pod --version; fi
      - name: Install Proofhouse
        run: python -m pip install -e .
      - name: Build fixed sample
        run: python scripts/native_build_sample.py ${{ matrix.platform }}
