[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptrig"
version = "0.1.1"
description = "Prompt operations framework for prompt architecture, audits, rewrites, and evals."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PromptRig Maintainers" }]
license = { text = "MIT" }
dependencies = ["jsonschema>=4.18", "rfc8785==0.1.4"]

[project.scripts]
promptrig = "promptrig.cli:main"
promptrig-compiler = "promptrig.compiler.cli_compiler:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"promptrig.compiler" = ["schemas/*.json"]
