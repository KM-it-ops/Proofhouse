[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofhouse"
version = "0.2.0"
description = "Prompt operations framework for prompt architecture, audits, rewrites, and evals."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Proofhouse Maintainers" }]
license = { text = "MIT" }
dependencies = ["jsonschema>=4.18", "rfc8785==0.1.4"]

[project.optional-dependencies]
live = ["httpx>=0.27"]

[project.scripts]
proofhouse = "proofhouse.cli:main"
proofhouse-compiler = "proofhouse.compiler.cli_compiler:main"
# Compatibility aliases, kept for one minor version so existing callers and
# scripts keep working across the rename. Removable at 0.3.0, not before.
promptrig = "proofhouse.cli:main"
promptrig-compiler = "proofhouse.compiler.cli_compiler:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: real or optional live-path tests; not collected by default"]
addopts = "-m \"not live\""

[tool.setuptools.package-data]
"proofhouse.compiler" = ["schemas/*.json"]
